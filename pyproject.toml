[project]
name = "task-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vitalien", email = "vitaldev8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
task-control = "task_control:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths=["tests"] 
pythonpath=["src"]
